<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Rainbow Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --r: #ff4d6d; --o: #ff9f1c; --y: #ffdd00; --g: #06d6a0; --b: #4cc9f0; --v: #a855f7;
    --glass: rgba(255,255,255,0.18);
    --glass-border: rgba(255,255,255,0.45);
    --shadow: 0 8px 32px rgba(168,85,247,0.18);
  }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: radial-gradient(ellipse at 20% 30%, #f0abfc 0%, #c084fc 25%, #818cf8 50%, #60a5fa 75%, #34d399 100%);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 12px 48px;
    position: relative; overflow-x: hidden;
  }

  /* Stars */
  .star { position: fixed; pointer-events: none; animation: twinkle 2s ease-in-out infinite; font-size: 14px; }
  @keyframes twinkle { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }

  /* Main card */
  .card {
    width: 100%; max-width: 480px;
    background: linear-gradient(135deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.12) 100%);
    backdrop-filter: blur(20px);
    border: 2px solid var(--glass-border);
    border-radius: 32px;
    padding: 0 0 28px 0;
    box-shadow: 0 8px 40px rgba(168,85,247,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
    position: relative; z-index: 10;
    animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(30px) scale(0.95)} to{opacity:1;transform:none} }

  /* Header */
  .header {
    position: relative; padding: 20px 24px 0 24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
    border-radius: 30px 30px 0 0;
    border-bottom: 1.5px solid rgba(255,255,255,0.3);
    padding-bottom: 18px; margin-bottom: 20px;
    overflow: visible;
  }
  .header-inner { display: flex; align-items: center; gap: 0; }
  .title {
    font-size: 28px; font-weight: 900;
    background: linear-gradient(90deg, #ff4d6d, #ff9f1c, #ffdd00, #06d6a0, #4cc9f0, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-shadow: none; line-height: 1.2; letter-spacing: -0.5px;
    flex: 1;
  }
  .unicorn-img {
    width: 150px; height: 150px; object-fit: contain;
    position: absolute; right: -8px; top: -30px;
    filter: drop-shadow(0 4px 12px rgba(168,85,247,0.3));
    animation: floatUni 3s ease-in-out infinite;
  }
  @keyframes floatUni { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-8px) rotate(3deg)} }

  /* Input area */
  .input-area { padding: 0 20px; margin-bottom: 14px; display: flex; gap: 10px; align-items: stretch; }
  .task-input {
    flex: 1; padding: 12px 18px; border-radius: 50px;
    background: rgba(255,255,255,0.55); border: 2px solid rgba(255,255,255,0.7);
    font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; color: #5b21b6;
    outline: none; transition: all 0.2s;
    box-shadow: inset 0 2px 6px rgba(168,85,247,0.08);
  }
  .task-input::placeholder { color: #b8a7d4; }
  .task-input:focus { border-color: #a855f7; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }

  .add-btn {
    padding: 12px 22px; border-radius: 50px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #f472b6, #a855f7);
    color: white; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
    box-shadow: 0 4px 16px rgba(168,85,247,0.35);
    transition: all 0.2s; white-space: nowrap;
  }
  .add-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 22px rgba(168,85,247,0.5); }
  .add-btn:active { transform: scale(0.97); }

  /* Extra inputs */
  .extra-inputs { padding: 0 20px; display: flex; gap: 10px; margin-bottom: 16px; }
  .date-input, .priority-select {
    flex: 1; padding: 9px 14px; border-radius: 50px;
    background: rgba(255,255,255,0.5); border: 2px solid rgba(255,255,255,0.65);
    font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #5b21b6;
    outline: none; cursor: pointer; transition: all 0.2s;
  }
  .date-input:focus, .priority-select:focus { border-color: #a855f7; background: rgba(255,255,255,0.75); }

  /* Filters */
  .filters { padding: 0 20px; display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-btn {
    padding: 7px 16px; border-radius: 50px; border: 2px solid rgba(255,255,255,0.6);
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer;
    background: rgba(255,255,255,0.35); color: #5b21b6; transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover { background: linear-gradient(135deg,#f472b6,#a855f7); color:white; border-color:transparent; transform:scale(1.05); }

  .sort-select {
    margin-left: auto; padding: 7px 14px; border-radius: 50px;
    background: rgba(255,255,255,0.4); border: 2px solid rgba(255,255,255,0.6);
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #5b21b6;
    outline: none; cursor: pointer;
  }

  /* Tasks list */
  .tasks-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }

  .task-item {
    background: rgba(255,255,255,0.38); border: 2px solid rgba(255,255,255,0.55);
    border-radius: 18px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.25s; position: relative; overflow: hidden;
    animation: taskIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes taskIn { from{opacity:0;transform:translateX(-20px) scale(0.95)} to{opacity:1;transform:none} }
  .task-item:hover { background: rgba(255,255,255,0.52); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168,85,247,0.15); }
  .task-item.done { opacity: 0.65; }
  .task-item.done .task-name { text-decoration: line-through; color: #9ca3af; }

  .task-item::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 18px 0 0 18px;
  }
  .task-item.p-high::before { background: linear-gradient(to bottom, #ff4d6d, #ff9f1c); }
  .task-item.p-medium::before { background: linear-gradient(to bottom, #ffdd00, #06d6a0); }
  .task-item.p-low::before { background: linear-gradient(to bottom, #4cc9f0, #a855f7); }

  .task-check {
    width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid rgba(168,85,247,0.5);
    background: rgba(255,255,255,0.5); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    font-size: 14px;
  }
  .task-check:hover { border-color: #a855f7; background: rgba(168,85,247,0.1); }
  .task-item.done .task-check { background: linear-gradient(135deg,#06d6a0,#4cc9f0); border-color: transparent; }

  .task-info { flex: 1; min-width: 0; }
  .task-name { font-size: 15px; font-weight: 700; color: #3b0764; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { display: flex; gap: 8px; margin-top: 4px; align-items: center; flex-wrap: wrap; }
  .task-deadline {
    font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 50px;
    display: flex; align-items: center; gap: 4px;
  }
  .deadline-ok { background: rgba(6,214,160,0.2); color: #059669; }
  .deadline-soon { background: rgba(255,221,0,0.3); color: #b45309; }
  .deadline-late { background: rgba(255,77,109,0.2); color: #dc2626; }
  .priority-badge {
    font-size: 11px; font-weight: 800; padding: 2px 10px; border-radius: 50px;
  }
  .badge-high { background: rgba(255,77,109,0.18); color: #dc2626; }
  .badge-medium { background: rgba(255,221,0,0.3); color: #d97706; }
  .badge-low { background: rgba(76,201,240,0.2); color: #0891b2; }

  .task-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .action-btn {
    width: 32px; height: 32px; border-radius: 10px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    transition: all 0.2s; background: rgba(255,255,255,0.6);
  }
  .action-btn:hover { transform: scale(1.15); }
  .edit-btn:hover { background: rgba(76,201,240,0.3); }
  .delete-btn:hover { background: rgba(255,77,109,0.25); }

  /* Edit modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(91,33,182,0.3); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    background: linear-gradient(135deg, rgba(255,255,255,0.88), rgba(240,220,255,0.92));
    border: 2px solid rgba(255,255,255,0.8); border-radius: 24px;
    padding: 28px; width: 90%; max-width: 380px;
    box-shadow: 0 16px 48px rgba(168,85,247,0.3);
    animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes modalIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:none} }
  .modal h3 { font-size: 20px; font-weight: 900; color: #5b21b6; margin-bottom: 16px; }
  .modal input, .modal select {
    width: 100%; padding: 10px 16px; border-radius: 50px; border: 2px solid rgba(168,85,247,0.25);
    font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; color: #3b0764;
    background: rgba(255,255,255,0.8); outline: none; margin-bottom: 12px;
  }
  .modal input:focus, .modal select:focus { border-color: #a855f7; }
  .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
  .save-btn, .cancel-btn {
    flex: 1; padding: 11px; border-radius: 50px; border: none; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; transition: all 0.2s;
  }
  .save-btn { background: linear-gradient(135deg,#f472b6,#a855f7); color: white; box-shadow: 0 4px 14px rgba(168,85,247,0.3); }
  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168,85,247,0.5); }
  .cancel-btn { background: rgba(255,255,255,0.7); color: #6b7280; }
  .cancel-btn:hover { background: rgba(255,255,255,0.9); }

  .empty { text-align: center; padding: 32px 20px; color: #7e22ce; font-size: 15px; font-weight: 700; }
  .empty-emoji { font-size: 40px; display: block; margin-bottom: 10px; animation: bounce 1s ease-in-out infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }

  .stats { padding: 16px 20px 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .stat-pill {
    padding: 5px 14px; border-radius: 50px; font-size: 13px; font-weight: 800;
    background: rgba(255,255,255,0.4); border: 1.5px solid rgba(255,255,255,0.6); color: #5b21b6;
  }
  .stat-done { background: rgba(6,214,160,0.2); color: #059669; border-color: rgba(6,214,160,0.3); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="header-inner">
      <div class="title">✨ My Rainbow Tasks</div>
    </div>
    <img class="unicorn-img" src="img/poni.png" alt="unicorn" onerror="this.style.display='none'">
  </div>

  <div class="stats">
    <span class="stat-pill" id="stat-total">📋 Всього: 0</span>
    <span class="stat-pill stat-done" id="stat-done">✅ Виконано: 0</span>
    <span class="stat-pill" id="stat-active">🔥 Активних: 0</span>
  </div>

  <div class="input-area" style="margin-top:16px;">
    <input class="task-input" id="taskInput" placeholder="Додай нове завдання..." maxlength="80">
    <button class="add-btn" onclick="addTask()">Додати ✦</button>
  </div>
  <div class="extra-inputs">
    <input class="date-input" type="date" id="taskDate">
    <select class="priority-select" id="taskPriority">
      <option value="high">🔴 Високий</option>
      <option value="medium" selected>🟡 Середній</option>
      <option value="low">🔵 Низький</option>
    </select>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">Всі</button>
    <button class="filter-btn" onclick="setFilter('active',this)">Активні</button>
    <button class="filter-btn" onclick="setFilter('done',this)">Виконані</button>
    <select class="sort-select" id="sortSelect" onchange="render()">
      <option value="date">За дедлайном</option>
      <option value="priority">За пріоритетом</option>
      <option value="added">За додаванням</option>
    </select>
  </div>

  <div class="tasks-list" id="tasksList"></div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h3>✏️ Редагування</h3>
    <input type="text" id="editName" placeholder="Назва завдання" maxlength="80">
    <input type="date" id="editDate">
    <select id="editPriority">
      <option value="high">🔴 Високий пріоритет</option>
      <option value="medium">🟡 Середній пріоритет</option>
      <option value="low">🔵 Низький пріоритет</option>
    </select>
    <div class="modal-btns">
      <button class="save-btn" onclick="saveEdit()">💾 Зберегти</button>
      <button class="cancel-btn" onclick="closeModal()">Скасувати</button>
    </div>
  </div>
</div>

<script src="task.js"></script>
</body>
</html>
