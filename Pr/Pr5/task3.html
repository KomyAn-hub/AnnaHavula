<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Завдання 3 — Пости</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --cream: #ede6d6;
    --rust: #b8430a;
    --gold: #c9921a;
    --muted: #7a6f5e;
    --line: #d4c9b0;
  }
 
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
    padding: 0;
  }
 
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 2.5rem 4rem;
    display: flex;
    align-items: flex-end;
    gap: 2rem;
    border-bottom: 4px solid var(--rust);
  }
 
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    line-height: 1;
    letter-spacing: -0.5px;
  }
 
  header .meta {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    padding-bottom: 0.3rem;
  }
 
  .subtitle {
    background: var(--rust);
    color: #fff;
    text-align: center;
    padding: 0.5rem;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
 
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }
 
  #status {
    text-align: center;
    padding: 4rem 0;
    color: var(--muted);
    font-style: italic;
    font-size: 1.1rem;
  }
 
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 2px solid var(--line);
    border-top-color: var(--rust);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 0.75rem;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
 
  .error-box {
    background: #fff0ec;
    border-left: 4px solid var(--rust);
    padding: 1.5rem 2rem;
    border-radius: 2px;
    color: var(--rust);
    font-weight: 400;
  }
 
  .posts-grid {
    display: grid;
    gap: 0;
  }
 
  .post {
    border-bottom: 1px solid var(--line);
    padding: 2rem 0;
    display: grid;
    grid-template-columns: 3rem 1fr;
    gap: 0 1.5rem;
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
 
  .post-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--line);
    line-height: 1.2;
    text-align: right;
    padding-top: 0.1rem;
  }
 
  .post-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 0.6rem;
    text-transform: capitalize;
  }
 
  .post-body {
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--muted);
    font-style: italic;
  }
 
  .count-bar {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--ink);
  }
</style>
</head>
<body>
 
<header>
  <div>
    <div class="meta">Завдання 3 · async/await</div>
    <h1>Стрічка постів</h1>
  </div>
</header>
<div class="subtitle">JSONPlaceholder API · Усі пости</div>
 
<main>
  <div id="status"><span class="spinner"></span> Завантаження постів…</div>
  <div id="posts-container"></div>
</main>


<script src= "task3.js"></script>
</body>
</html>
