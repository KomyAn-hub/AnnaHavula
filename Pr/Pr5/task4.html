<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Завдання 4 — Профіль користувача</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #f0883e;
    --card: #1c2128;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .topbar-logo {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 1.3rem;
    color: var(--accent);
  }

  .topbar-label {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 0.2rem 0.6rem;
    border-radius: 100px;
  }

  .layout {
    max-width: 1050px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 2rem;
    align-items: start;
  }

  /* ---- Profile Card ---- */
  .profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  .avatar-band {
    height: 80px;
    background: linear-gradient(135deg, #1c3a5e 0%, #0d1f35 100%);
    position: relative;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--green));
    border: 3px solid var(--surface);
    position: absolute;
    bottom: -36px;
    left: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: #fff;
  }

  .profile-body {
    padding: 2.8rem 1.5rem 1.5rem;
  }

  .profile-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 1.4rem;
    color: var(--text);
    line-height: 1.2;
  }

  .profile-username {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0.2rem 0 1rem;
  }

  .profile-stat {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 0.45rem;
  }

  .profile-stat .icon { color: var(--accent); font-size: 0.9rem; }

  .profile-stat a { color: var(--accent); text-decoration: none; }
  .profile-stat a:hover { text-decoration: underline; }

  .profile-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1rem 0;
  }

  .company-label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .company-name {
    font-size: 0.85rem;
    color: var(--text);
  }

  .company-phrase {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 0.2rem;
  }

  /* ---- Skeleton ---- */
  .skeleton {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem 1.5rem;
    margin-bottom: 0.8rem;
  }

  .skeleton-top {
    height: 80px;
    border-radius: 10px 10px 0 0;
    border-bottom: none;
    margin-bottom: 0;
  }

  .skeleton-bottom {
    border-radius: 0 0 10px 10px;
    padding-top: 2.5rem;
  }

  .skel-line {
    height: 12px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--border) 25%, var(--surface) 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    margin-bottom: 0.6rem;
  }

  .skel-w-60 { width: 60%; }
  .skel-w-40 { width: 40%; }
  .skel-w-80 { width: 80%; }
  .skel-w-70 { width: 70%; }
  .skel-w-90 { width: 90%; }
  .skel-w-55 { width: 55%; }

  @keyframes shimmer {
    from { background-position: 200% 0; }
    to   { background-position: -200% 0; }
  }

  /* ---- Posts Panel ---- */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
  }

  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    color: var(--text);
  }

  .badge {
    background: var(--green);
    color: #0d1117;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.2rem 0.6rem;
    border-radius: 100px;
    letter-spacing: 0.05em;
  }

  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem 1.5rem;
    margin-bottom: 0.8rem;
    transition: border-color 0.2s, background 0.2s;
    animation: fadeIn 0.4s ease both;
  }

  .post-card:hover {
    border-color: rgba(88, 166, 255, 0.4);
    background: var(--surface);
  }

  .post-title {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 0.5rem;
    text-transform: capitalize;
    line-height: 1.4;
  }

  .post-body {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.65;
    font-style: italic;
  }

  /* ---- Error ---- */
  .error-msg {
    background: rgba(240, 136, 62, 0.1);
    border: 1px solid rgba(240, 136, 62, 0.35);
    color: var(--orange);
    border-radius: 8px;
    padding: 1rem 1.5rem;
    font-size: 0.85rem;
  }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">UserHub</span>
  <span class="topbar-label">Promise.all</span>
</div>

<div class="layout">
  <aside id="profile-sidebar">
    <div class="skeleton skeleton-top"></div>
    <div class="skeleton skeleton-bottom">
      <div class="skel-line skel-w-60"></div>
      <div class="skel-line skel-w-40"></div>
      <div class="skel-line skel-w-80"></div>
      <div class="skel-line skel-w-70"></div>
    </div>
  </aside>

  <section>
    <div class="panel-header">
      <h2 class="panel-title">Публікації</h2>
      <span class="badge" id="posts-count">—</span>
    </div>
    <div id="posts-list">
      <div class="skeleton">
        <div class="skel-line skel-w-70"></div>
        <div class="skel-line skel-w-90"></div>
        <div class="skel-line skel-w-55"></div>
      </div>
      <div class="skeleton">
        <div class="skel-line skel-w-70"></div>
        <div class="skel-line skel-w-90"></div>
        <div class="skel-line skel-w-55"></div>
      </div>
      <div class="skeleton">
        <div class="skel-line skel-w-70"></div>
        <div class="skel-line skel-w-90"></div>
        <div class="skel-line skel-w-55"></div>
      </div>
    </div>
  </section>
</div>

<script src = task4.js></script>
</body>
</html>
