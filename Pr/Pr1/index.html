<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Завдання</title>
</head>
<body>
    <p>JavaScript</p>
<script> 
    function task1() {
      let vik = Number(prompt("Введіть ваш вік:"));
 
      if (vik < 18) {
        alert("Вам заборонено вхід");
      } else if (vik >= 18 && vik <= 65) {
        alert("Ласкаво просимо!");
      } else {
        alert("Будь ласка, будьте обережні!");
      }
    }

    
     function task5() {
      let secret = Math.floor(Math.random() * 100) + 1;
      let guess;
 
      do {
        guess = Number(prompt("Вгадайте число від 1 до 100:"));
 
        if (guess < secret) {
          alert("Загадане число більше");
        } else if (guess > secret) {
          alert("Загадане число менше");
        } else {
          alert("Вітаємо! Ви вгадали число!");
        }
      } while (guess !== secret);
    }

    task1();

function task4() {
      let a = Number(prompt("Введіть перше число (a):"));
      let b = Number(prompt("Введіть друге число (b):"));
      let op = prompt("Введіть операцію (+, -, *, /):");
      let result;
 
      switch (op) {
        case "+":
          result = a + b;
          break;
        case "-":
          result = a - b;
          break;
        case "*":
          result = a * b;
          break;
        case "/":
          if (b === 0) {
            alert("Ділення на нуль неможливе!");
            return;
          }
          result = a / b;
          break;
        default:
          alert("Невідома операція!");
          return;
      }
 
      alert(a + " " + op + " " + b + " = " + result);
    }
 

</script>
</body>
</html>
